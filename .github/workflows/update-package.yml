name: Update Claude Desktop

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-claude-desktop
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for a new package
        id: update
        run: python3 scripts/update-package.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.changes.outputs.changed == 'true'
        uses: cachix/install-nix-action@v31

      - name: Build package
        if: steps.changes.outputs.changed == 'true'
        run: NIXPKGS_ALLOW_UNFREE=1 nix build --no-link --impure .#claude-desktop

      - name: Commit update
        if: steps.changes.outputs.changed == 'true'
        run: |
          version=$(sed -n 's/^  version = "\([^"]*\)";$/\1/p' package.nix)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.nix
          git commit -m "claude-desktop: update to ${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
